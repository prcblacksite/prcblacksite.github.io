first_steps:
  - { title: "Say hello in the camp", text: "Go to #cd-common. That is the detainee camp and it is open to you right now, with no application and no waiting. Everyone starts as a Contingent Asset, the Corporation's word for somebody it has not assigned to a job yet." }
