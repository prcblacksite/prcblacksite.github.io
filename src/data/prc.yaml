  SEC:
    - { title: Cadet, can: "Supervised gate duty only." }
    - { title: Officer, can: "Gate, escort, head count, contraband sweep, cuffs." }
    - { title: Senior Officer, can: "Take the gate alone. Search a bunk row. Train cadets. Eligible for Vanguard selection." }
    - { title: Sergeant, can: "Runs the watch. Sets the escort roster." }
    - { title: Watch Commander, can: "Runs the division for a shift. Declares a riot. Requests the Vanguard." }
    - { title: Chief of Security, can: "Owns the camp, the Wire and the procedure." }
  "E&T":
    - { title: Probationer, can: "Assist a placement. Cannot place." }
    - { title: Works Hand, can: "Place approved modules from the catalogue." }
    - { title: Technician, can: "Place restricted modules: power, comms, lighting." }
    - { title: Foreman, can: "Runs the works shift. Decides the order of the build." }
    - { title: Works Director, can: "Owns the module catalogue, the build order and the spend side of the budget." }
  LOG:
    - { title: Probationer, can: "Ride along. Load, do not drive." }
    - { title: Loader, can: "Work the skip, unload the boat, stock the commissary." }
    - { title: Storeman, can: "Drive the truck. Hold stores keys. Run an inventory count." }
    - { title: Quartermaster, can: "Runs the supply shift and sets the commissary price list." }
  ADM:
    - { title: Probationer, can: "Shadow an intake." }
    - { title: Clerk, can: "Process intake, take muster, file reports, run the ledger entries." }
    - { title: Senior Clerk, can: "Audit a promotion. Draft documents for the archive. Train probationers." }
    - { title: Records Supervisor, can: "Run the office for a shift. Approve a personnel file." }
    - { title: Registrar, can: "Owns records, applications and the archive." }
  MVF:
    - { title: Selection, can: "On the selection op. Not yet Vanguard." }
    - { title: Vanguard, can: "Kit, patrol, respond as part of a team." }
    - { title: Operator, can: "A specialist slot: breacher, coxswain, marksman or medic." }
    - { title: Section Leader, can: "Leads a four person section. Takes the field on contact." }
    - { title: Vanguard Commander, can: "Owns response doctrine, selection and the cap on the branch." }

