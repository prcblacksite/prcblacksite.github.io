# ------------------------------------------------------------------ decisions this file settles
# Where the old pages disagreed, this is the answer, and every page now says it.
settled:
  - "The application is six questions: three picked in /apply, then a short form with two required and two optional answers. Orientation and the #how-to-join pin said five."
  - "Rank names come in three layers: the grade (the contract), the band (Initiate, Operator, Custodian, Director: what Discord and Roblox show) and the branch title (the flavour). Orientation showed only the bands, the wiki only the titles."
  - "Six branches. Five are somewhere you can end up; Command is not applied to. Pages said five or six without saying which."
  - "The opposition is the Continuum Interest (CI). The Roblox About still said the Insurgency."
  - "Six ping roles, Breakthrough included. The wiki listed five."
  - "The #orientation-files pin links the wiki as well as orientation and the website."
  - "MVF's G2 title is Operator and so is the band for G1 and G2. Harmless, but if it ever confuses anyone, rename the title, not the band."

